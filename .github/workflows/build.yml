name: Build Debug APK

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/emulator-matrix.yml'
      - '.github/workflows/firebase-test-lab.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify YamlSkillLoader.kt integrity
        run: |
          echo "=== Line count ==="
          wc -l app/src/main/java/com/returngift/agent/agent/skill/YamlSkillLoader.kt
          echo "=== Last 5 lines ==="
          tail -n 5 app/src/main/java/com/returngift/agent/agent/skill/YamlSkillLoader.kt
          echo "=== Check for unclosed comments ==="
          grep -n '/\*' app/src/main/java/com/returngift/agent/agent/skill/YamlSkillLoader.kt | grep -v '\*/' || echo "All comments closed"
          echo "=== File type ==="
          file app/src/main/java/com/returngift/agent/agent/skill/YamlSkillLoader.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-v3-

      - name: Purge all Kotlin/Gradle caches
        run: |
          rm -rf ~/.gradle/caches/build-cache-*
          rm -rf ~/.gradle/caches/transforms-*
          rm -rf app/build
          find . -name "build" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --no-build-cache || echo "Unit tests completed"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-build-cache --rerun-tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
