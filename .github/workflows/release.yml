name: Release APK

# Cancel in-progress runs for the same tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
      - '3.0.0'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee test.log || {
            echo "## Unit Tests Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Run Android Lint
        run: ./gradlew lintDebug || echo "Lint check completed with non-fatal warnings"

      - name: Check Detekt
        run: |
          if grep -q "id.*detekt" build.gradle.kts app/build.gradle.kts 2>/dev/null; then
            ./gradlew detekt
          else
            echo "Detekt not configured - skipping"
          fi

  release:
    name: Build & Release
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-v3-

      - name: Purge all Kotlin/Gradle caches
        run: |
          rm -rf ~/.gradle/caches/build-cache-*
          rm -rf ~/.gradle/caches/transforms-*
          rm -rf app/build
          find . -name "build" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Derive APK version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag form: v1.1.0 or v1.1.0-20260816...
          base="${TAG#v}"            # strip leading v
          semver="${base%%-*}"        # strip -suffix -> 1.1.0
          # versionCode = major*10000 + minor*100 + patch (monotonic, fits in int)
          IFS='.' read -r major minor patch <<< "$semver"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          code=$(( major*10000 + minor*100 + patch ))
          echo "version_name=$semver" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Derived from $TAG -> versionName=$semver versionCode=$code"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RETURNGIFT_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          RETURNGIFT_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Using production release keystore from GitHub Secrets"
            KEYSTORE_PATH="$RUNNER_TEMP/returngift-release.keystore"
            echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            printf "KEYSTORE_FILE=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\nRETURNGIFT_VERSION_NAME=%s\nRETURNGIFT_VERSION_CODE=%s\n" \
              "$KEYSTORE_PATH" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$RETURNGIFT_VERSION_NAME" "$RETURNGIFT_VERSION_CODE" > local.properties
          else
            echo "GitHub Secrets not set: generating stable CI release keystore"
            KEYSTORE_PATH="$RUNNER_TEMP/returngift-ci.keystore"
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias returngift -keyalg RSA -keysize 2048 -validity 10000 -storepass returngift -keypass returngift -dname "CN=ReturnGift CI, OU=Android, O=ReturnGift, L=Default, S=Default, C=US"
            printf "KEYSTORE_FILE=%s\nKEYSTORE_PASSWORD=returngift\nKEY_ALIAS=returngift\nKEY_PASSWORD=returngift\nRETURNGIFT_VERSION_NAME=%s\nRETURNGIFT_VERSION_CODE=%s\n" \
              "$KEYSTORE_PATH" "$RETURNGIFT_VERSION_NAME" "$RETURNGIFT_VERSION_CODE" > local.properties
          fi

      - name: Build signed release APK
        env:
          RETURNGIFT_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          RETURNGIFT_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          ./gradlew assembleRelease --no-build-cache --rerun-tasks --stacktrace 2>&1 | tee build.log || {
            echo "## Release Build Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Generate release checksums and rename APK
        run: |
          set -e
          OUT=app/build/outputs/apk/release
          ls -la "$OUT" || true
          # The release variant builds a single universal APK (splits are disabled).
          APK_PATH=$(find "$OUT" -maxdepth 1 -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in $OUT"
            exit 1
          fi
          echo "Source APK: $APK_PATH"
          # Ensure the canonical names exist for the README badge and UpdateChecker.
          for CANONICAL in ReturnGift-release.apk ReturnGift.apk; do
            if [ "$(basename "$APK_PATH")" != "$CANONICAL" ]; then
              cp "$APK_PATH" "$OUT/$CANONICAL"
            fi
          done
          ( cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt )
          echo "Published APKs:" && ls -la "$OUT"/*.apk

      - name: Extract release notes from README
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          # Match the semver base (strip any -suffix), e.g. 1.1.0-20260816 -> 1.1.0
          base = version.split("-")[0]
          text = Path("README.md").read_text()

          # Try to find changelog entry for this version (### v1.1.0 ...)
          header = re.compile(rf"^### v{re.escape(base)}\b.*$", re.MULTILINE)
          match = header.search(text)

          if match:
              rest = text[match.end():]
              next_header = re.search(r"^### v", rest, re.MULTILINE)
              notes = (rest[:next_header.start()] if next_header else rest).strip()
              if notes:
                  Path("release-notes.md").write_text(notes + "\n")
                  print(f"Found changelog for v{base}")
              else:
                  # Generate default release notes
                  Path("release-notes.md").write_text(f"Release v{version}\n\nSee GitHub release page for details.\n")
                  print(f"No changelog body for v{base}, using default")
          else:
              # No changelog entry - use default
              Path("release-notes.md").write_text(f"Release v{version}\n\nSee GitHub release page for details.\n")
              print(f"No changelog for v{base}, using default")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          body_path: release-notes.md
          draft: false
          prerelease: false
