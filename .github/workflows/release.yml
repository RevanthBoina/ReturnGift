name: Release APK

# Cancel in-progress runs for the same tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run CI preflight
        run: bash scripts/ci-preflight.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-v3-

      - name: Derive APK version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag form: v1.1.0 or v1.1.0-20260816...
          base="${TAG#v}"            # strip leading v
          semver="${base%%-*}"        # strip -suffix -> 1.1.0
          # versionCode = major*10000 + minor*100 + patch (monotonic, fits in int)
          IFS='.' read -r major minor patch <<< "$semver"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          code=$(( major*10000 + minor*100 + patch ))
          echo "version_name=$semver" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Derived from $TAG -> versionName=$semver versionCode=$code"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RETURNGIFT_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          RETURNGIFT_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
              echo "Using production release keystore from GitHub Secrets"
              KEYSTORE_PATH="$RUNNER_TEMP/returngift-release.keystore"
              echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
              STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
              ALIAS="$ANDROID_KEY_ALIAS"
              KEY_PASS="$ANDROID_KEY_PASSWORD"
              KEYSTORE_TYPE="production"
          else
              echo "GitHub Secrets not set: generating stable CI release keystore"
              KEYSTORE_PATH="$RUNNER_TEMP/returngift-ci.keystore"
              keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias returngift -keyalg RSA -keysize 2048 -validity 10000 -storepass returngift -keypass returngift -dname "CN=ReturnGift CI, OU=Android, O=ReturnGift, L=Default, S=Default, C=US"
              STORE_PASS="returngift"
              ALIAS="returngift"
              KEY_PASS="returngift"
              KEYSTORE_TYPE="ci-fallback"
          fi
          # Log which keystore is being used
          echo "KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"
          # Ensure sdk.dir and signing credentials are in local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> local.properties
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> local.properties
          echo "KEY_ALIAS=$ALIAS" >> local.properties
          echo "KEY_PASSWORD=$KEY_PASS" >> local.properties
          echo "RETURNGIFT_VERSION_NAME=$RETURNGIFT_VERSION_NAME" >> local.properties
          echo "RETURNGIFT_VERSION_CODE=$RETURNGIFT_VERSION_CODE" >> local.properties
          mkdir -p app
          cp local.properties app/local.properties
          # Export to GITHUB_ENV so Gradle tasks have direct environment access
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          set -eo pipefail
          echo "Building with keystore type: $KEYSTORE_TYPE"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee assemble-release.log || {
            echo "## Build signed release APK Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 assemble-release.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # Verify the APK signature
          APK_PATH=$(find . -path "*/outputs/apk/*" -name "*.apk" | grep -i "release" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "=== APK Signature Verification ==="
            apksigner verify --print-certs "$APK_PATH" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: assemble-release-log
          path: assemble-release.log
          retention-days: 14

      - name: Generate release checksums and rename APK
        run: |
          set -e
          echo "=== Locating generated release APK across workspace ==="
          find . -name "*.apk" || true
          # Search for release APK in build outputs or any directory
          APK_PATH=$(find . -path "*/outputs/apk/*" -name "*.apk" | grep -i "release" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*release*.apk" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/*" -name "*.apk" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in repository after assembleRelease"
            exit 1
          fi
          echo "=== Source APK found: $APK_PATH ==="
          mkdir -p release-artifacts
          cp "$APK_PATH" release-artifacts/ReturnGift-release.apk
          ( cd release-artifacts && sha256sum ReturnGift-release.apk > SHA256SUMS.txt )
          echo "=== Published release artifacts ==="
          ls -la release-artifacts/
          # Also populate app/build/outputs/apk/release for backwards compatibility
          mkdir -p app/build/outputs/apk/release
          cp release-artifacts/* app/build/outputs/apk/release/ || true

      - name: Extract release notes from README
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          # Match the semver base (strip any -suffix), e.g. 1.1.0-20260816 -> 1.1.0
          base = version.split("-")[0]
          text = Path("README.md").read_text()

          # Try to find changelog entry for this version (### v1.1.0 ...)
          header = re.compile(rf"^### v{re.escape(base)}\b.*$", re.MULTILINE)
          match = header.search(text)

          if match:
              rest = text[match.end():]
              next_header = re.search(r"^### v", rest, re.MULTILINE)
              notes = (rest[:next_header.start()] if next_header else rest).strip()
              if notes:
                  Path("release-notes.md").write_text(notes + "\n")
                  print(f"Found changelog for v{base}")
              else:
                  # Generate default release notes
                  Path("release-notes.md").write_text(f"Release v{version}\n\nSee GitHub release page for details.\n")
                  print(f"No changelog body for v{base}, using default")
          else:
              # No changelog entry - use default
              Path("release-notes.md").write_text(f"Release v{version}\n\nSee GitHub release page for details.\n")
              print(f"No changelog for v{base}, using default")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
          body_path: release-notes.md
          draft: false
          prerelease: false
