name: Release APK

# Cancel in-progress runs for the same tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Check Detekt
        run: |
          if grep -q "id.*detekt" build.gradle.kts app/build.gradle.kts 2>/dev/null; then
            ./gradlew detekt
          else
            echo "Detekt not configured - skipping"
          fi

  release:
    name: Build & Release
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Derive APK version from tag
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag form: v1.1.0 or v1.1.0-20260816...
          base="${TAG#v}"            # strip leading v
          semver="${base%%-*}"        # strip -suffix -> 1.1.0
          # versionCode = major*10000 + minor*100 + patch (monotonic, fits in int)
          IFS='.' read -r major minor patch <<< "$semver"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          code=$(( major*10000 + minor*100 + patch ))
          echo "version_name=$semver" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Derived from $TAG -> versionName=$semver versionCode=$code"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RETURNGIFT_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          RETURNGIFT_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          missing=0
          for var in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required Actions secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish a public APK without a stable signing key."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/returngift-release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          cat > local.properties <<EOF
          KEYSTORE_FILE=$KEYSTORE_PATH
          KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          KEY_ALIAS=$ANDROID_KEY_ALIAS
          KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          RETURNGIFT_VERSION_NAME=$RETURNGIFT_VERSION_NAME
          RETURNGIFT_VERSION_CODE=$RETURNGIFT_VERSION_CODE
          EOF

      - name: Build signed release APK
        env:
          RETURNGIFT_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          RETURNGIFT_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: ./gradlew assembleRelease

      - name: Generate release checksums and rename APK
        run: |
          set -e
          OUT=app/build/outputs/apk/release
          # Locate the built release APK (gradle names it ReturnGift-release.apk or
          # ReturnGift_v<ver>_<ts>.apk depending on variant config). Pick the first .apk.
          APK_PATH=$(find "$OUT" -maxdepth 1 -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in $OUT"
            ls -la "$OUT" || true
            exit 1
          fi
          echo "Source APK: $APK_PATH"
          # Publish under the canonical name used by the README download badge and the
          # in-app UpdateChecker so /latest/download/ReturnGift-release.apk always resolves.
          # If the source already has that name, copy to the .apk alias instead.
          if [ "$(basename "$APK_PATH")" != "ReturnGift-release.apk" ]; then
            cp "$APK_PATH" "$OUT/ReturnGift-release.apk"
          fi
          if [ "$(basename "$APK_PATH")" != "ReturnGift.apk" ]; then
            cp "$APK_PATH" "$OUT/ReturnGift.apk"
          fi
          ( cd "$OUT" && sha256sum ReturnGift-release.apk ReturnGift.apk > SHA256SUMS.txt )
          echo "Published APKs:" && ls -la "$OUT"/*.apk

      - name: Extract release notes from README
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          # Match the semver base (strip any -suffix), e.g. 1.1.0-20260816 -> 1.1.0
          base = version.split("-")[0]
          text = Path("README.md").read_text()

          # Try to find changelog entry for this version (### v1.1.0 ...)
          header = re.compile(rf"^### v{re.escape(base)}\b.*$", re.MULTILINE)
          match = header.search(text)

          if match:
              rest = text[match.end():]
              next_header = re.search(r"^### v", rest, re.MULTILINE)
              notes = (rest[:next_header.start()] if next_header else rest).strip()
              if notes:
                  Path("release-notes.md").write_text(notes + "\n")
                  print(f"Found changelog for v{base}")
              else:
                  # Generate default release notes
                  Path("release-notes.md").write_text(f"Release v{version}\n\nSee GitHub release page for details.\n")
                  print(f"No changelog body for v{base}, using default")
          else:
              # No changelog entry - use default
              Path("release-notes.md").write_text(f"Release v{version}\n\nSee GitHub release page for details.\n")
              print(f"No changelog for v{base}, using default")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          body_path: release-notes.md
          draft: false
          prerelease: false
