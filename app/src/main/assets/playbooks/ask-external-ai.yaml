      # ── Tier 4: Specialized AI tools ──
      - pkg: com.grammarly.android.keyboard
        version_name: "2.10.22"
        version_code: 21022
        deep_link: null  # Keyboard-based, no deep link
        capabilities: [grammar, tone, clarity, rewrite]
        auth_required: false
        free_tier: true
        notes: "Runs as keyboard; invoke via share-to-app or clipboard"

      - pkg: com.deepl.mobile
        version_name: "3.6.0"
        version_code: 360
