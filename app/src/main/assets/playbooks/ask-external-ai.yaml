        version_name: "1.0.0"
        version_code: 100
        deep_link: "https://claude.ai/new?q={query}"
        browser_fallback_url: "https://claude.ai/new?q={query|urlencode}"
        capabilities: [chat, analyze, artifacts, code, long_context]
        auth_required: true
        free_tier: true
        notes: "Artifacts for interactive content; long context window"

      - pkg: com.microsoft.copilot
        version_name: "27.4.420715004"
        version_code: 274
        deep_link: "https://copilot.microsoft.com/?q={query}"
        browser_fallback_url: "https://copilot.microsoft.com/?q={query|urlencode}"
        capabilities: [chat, search, image_gen, web_sources]
        auth_required: false
        free_tier: true
        notes: "DALL-E image generation, Bing integration"

      - pkg: com.poe.android
        version_name: "2.0.8"
        version_code: 208
        deep_link: "https://poe.com/search?q={query}"
        browser_fallback_url: "https://poe.com/search?q={query|urlencode}"
        capabilities: [chat, multi_model, summarize, code]
        auth_required: true
