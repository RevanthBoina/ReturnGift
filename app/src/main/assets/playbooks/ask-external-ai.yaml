# ═══════════════════════════════════════════════════════════════════════════
# SLOTS — Type-safe, validated, normalized
# ═══════════════════════════════════════════════════════════════════════════
slots:
  # ── Primary: The query/prompt ──
  query:
    type: string
    required: true
    max_len: 4000  # Increased for long prompts
    min_len: 2
    normalize: [trim, collapse_ws]
    prompt_if_missing: "What would you like to ask?"
    description: "The question or prompt to send to the AI"

  # ── App selection ──
  app:
    type: enum
    values:
      - chatgpt
      - grok
      - perplexity
      - gemini
      - claude
      - copilot
      - poe
      - grammarly
      - deepl
      - quillbot
      - gamma
      - notebooklm
      - consensus
      - humata
    required: true
    default: chatgpt
    inference_hints:
      chatgpt: ["chatgpt", "gpt", "open ai", "chat gpt", "gpt-4", "gpt-3"]
      grok: ["grok", "x ai", "xai", "twitter ai"]
      perplexity: ["perplexity", "perp"]
      gemini: ["gemini", "google ai", "bard", "google gemini"]
      claude: ["claude", "anthropic", "claude ai"]
      copilot: ["copilot", "microsoft copilot", "bing chat", "bing ai"]
      poe: ["poe", "quora"]
      grammarly: ["grammarly", "grammar check", "check grammar"]
      deepl: ["deepl", "deepl translate", "translate"]
      quillbot: ["quillbot", "paraphrase", "rewrite"]
      gamma: ["gamma", "gamma app", "make presentation", "create deck"]
      notebooklm: ["notebooklm", "notebook lm", "google notebook"]
      consensus: ["consensus", "scientific search", "research papers"]
      humata: ["humata", "pdf analysis", "analyze pdf"]
    prompt_if_ambiguous: "Which AI would you like to use? Options: {candidates}"
    description: "Which AI application to query"

  # ── Capability-specific slots ──
  capability:
    type: enum
    values:
      - chat          # General conversation
      - summarize     # Summarize text/document
      - translate     # Translate text
      - rewrite       # Rewrite/paraphrase text
      - explain       # Explain concept/screenshot
      - code          # Code assistance
      - analyze       # Analyze data/document
      - generate      # Generate content (text, image, etc.)
      - research      # Research with citations
    required: false
    default: chat
    inference_hints:
      summarize: ["summarize", "summary", "tldr", "shorten", "brief"]
      translate: ["translate", "translation", "in spanish", "to hindi", "convert to"]
      rewrite: ["rewrite", "rephrase", "paraphrase", "reword", "improve wording"]
      explain: ["explain", "what is", "how does", "why does", "breakdown"]
      code: ["code", "debug", "fix bug", "write function", "program", "script"]
      analyze: ["analyze", "analysis", "examine", "review", "evaluate"]
      generate: ["generate", "create", "make", "produce", "write"]
      research: ["research", "papers", "studies", "evidence", "sources"]
    description: "What type of AI assistance is needed"

  # ── Translation-specific ──
  target_language:
    type: string
    required: false
    normalize: [trim, casefold]
    description: "Target language for translation (e.g., 'Spanish', 'Hindi')"
  source_language:
    type: string
    required: false
    default: "auto"
    normalize: [trim, casefold]
    description: "Source language (default: auto-detect)"

  # ── Summarization-specific ──
  text_to_process:
    type: string
    required: false
    max_len: 10000
    description: "Text to summarize, translate, or rewrite (from clipboard or input)"

  # ── Code-specific ──
  programming_language:
    type: string
    required: false
    normalize: [trim, casefold]
    inference_hints:
      python: ["python", "py"]
      javascript: ["javascript", "js", "node"]
      java: ["java"]
      kotlin: ["kotlin", "kt"]
      swift: ["swift"]
      cpp: ["c++", "cpp"]
      rust: ["rust"]
      go: ["go", "golang"]
    description: "Programming language for code assistance"

  # ── Document/URL context ──
  source_url:
    type: url
    required: false
    description: "URL of document/article to analyze"
  source_file:
    type: file_path
    required: false
    description: "Local file path for document analysis"

# ═══════════════════════════════════════════════════════════════════════════
# EXECUTION — Intent-first with UI fallback
# ═══════════════════════════════════════════════════════════════════════════
execution:
  strategy: first_success
  routes:

    # ═══════════════════════════════════════════════════════════════════════
    # TIER 0.5: Browser fallback (when native app not installed)
    # ═══════════════════════════════════════════════════════════════════════

    - id: browser_fallback
      when: "not app.installed('{app|to_package}') and slots.app not in ['grammarly', 'humata', 'notebooklm']"
      kind: intent
      reliability: 0.80
      cost_ms: 1500
      notes: "Fires when native app absent. All HTTPS URLs are mobile-browser-compatible."
      intent:
        action: android.intent.action.VIEW
        data: "{app|browser_fallback_url}"
        package: com.android.chrome
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_settled, timeout_ms: 6000 }
      verify:
        - { assert: foreground_package, equals: com.android.chrome }

    # ═══════════════════════════════════════════════════════════════════════
    # TIER 1: Deep link intents (highest reliability)
    # ═══════════════════════════════════════════════════════════════════════

    # ── ChatGPT: Deep link ──
    - id: chatgpt_deep_link
      when: "slots.app == 'chatgpt'"
      kind: intent
      reliability: 0.88
      cost_ms: 1200
      intent:
        action: android.intent.action.VIEW
        data: "https://chat.openai.com/?q={query|urlencode}"
        package: com.openai.chatgpt
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: chatgpt_conversation, timeout_ms: 8000 }
        - { op: wait, for: screen_settled, timeout_ms: 5000 }
      verify:
        - { assert: on_screen, value: chatgpt_conversation }
        - { assert: foreground_package, equals: com.openai.chatgpt }

    # ── ChatGPT: Canvas mode (for long-form/code) ──
    - id: chatgpt_canvas
      when: "slots.app == 'chatgpt' and slots.capability in ['code', 'rewrite', 'generate'] and slots.query|len > 200"
      kind: intent
      reliability: 0.80
      cost_ms: 1500
      intent:
        action: android.intent.action.VIEW
        data: "https://chat.openai.com/?q={query|urlencode}&canvas=true"
        package: com.openai.chatgpt
      then:
        - { op: wait, for: screen_signature, value: chatgpt_canvas, timeout_ms: 10000 }

    # ── Perplexity: Deep link ──
    - id: perplexity_deep_link
      when: "slots.app == 'perplexity'"
      kind: intent
      reliability: 0.90
      cost_ms: 1000
      intent:
        action: android.intent.action.VIEW
        data: "https://www.perplexity.ai/search?q={query|urlencode}"
        package: ai.perplexity.app
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: perplexity_results, timeout_ms: 8000 }
      verify:
        - { assert: on_screen, value: perplexity_results }

    # ── Grok: Deep link ──
    - id: grok_deep_link
      when: "slots.app == 'grok'"
      kind: intent
      reliability: 0.82
      cost_ms: 1200
      intent:
        action: android.intent.action.VIEW
        data: "https://x.ai/?q={query|urlencode}"
        package: com.x.ai
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: grok_conversation, timeout_ms: 8000 }
      verify:
        - { assert: on_screen, value: grok_conversation }

    # ── Gemini: Deep link ──
    - id: gemini_deep_link
      when: "slots.app == 'gemini'"
      kind: intent
      reliability: 0.85
      cost_ms: 1200
      intent:
        action: android.intent.action.VIEW
        data: "https://gemini.google.com/app?prompt={query|urlencode}"
        package: com.google.android.apps.bard
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: gemini_conversation, timeout_ms: 8000 }
      verify:
        - { assert: on_screen, value: gemini_conversation }

    # ── Claude: Deep link ──
    - id: claude_deep_link
      when: "slots.app == 'claude'"
      kind: intent
      reliability: 0.80
      cost_ms: 1500
      intent:
        action: android.intent.action.VIEW
        data: "https://claude.ai/new?q={query|urlencode}"
        package: com.anthropic.claude
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: claude_home, timeout_ms: 10000 }

    # ── Claude: Artifact mode (for interactive content) ──
    - id: claude_artifact
      when: "slots.app == 'claude' and slots.capability in ['code', 'generate']"
      kind: intent
      reliability: 0.75
      cost_ms: 2000
      intent:
        action: android.intent.action.VIEW
        data: "https://claude.ai/new?q={query|urlencode}&artifact=true"
        package: com.anthropic.claude
      then:
        - { op: wait, for: screen_signature, value: claude_artifact, timeout_ms: 12000 }

    # ── Copilot: Deep link ──
    - id: copilot_deep_link
      when: "slots.app == 'copilot'"
      kind: intent
      reliability: 0.85
      cost_ms: 1000
      intent:
        action: android.intent.action.VIEW
        data: "https://copilot.microsoft.com/?q={query|urlencode}"
        package: com.microsoft.copilot
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: copilot_home, timeout_ms: 8000 }

    # ── DeepL: Translation deep link ──
    - id: deepl_translate
      when: "slots.app == 'deepl' or (slots.capability == 'translate' and slots.app == null)"
      kind: intent
      reliability: 0.88
      cost_ms: 800
      intent:
        action: android.intent.action.VIEW
        data: "https://www.deepl.com/translator#{source_language|default_auto}/{target_language|default_en}/{query|urlencode}"
        package: com.deepl.mobile
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: deepl_translator, timeout_ms: 6000 }
      verify:
        - { assert: on_screen, value: deepl_translator }

    # ── QuillBot: Paraphrase deep link ──
    - id: quillbot_paraphrase
      when: "slots.app == 'quillbot'"
      kind: intent
      reliability: 0.78
      cost_ms: 1200
      intent:
        action: android.intent.action.VIEW
        data: "https://quillbot.com/paraphrase?text={query|urlencode}"
        package: com.quillbot.mobile
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_settled, timeout_ms: 8000 }

    # ── Gamma: Presentation creation ──
    - id: gamma_create
      when: "slots.app == 'gamma'"
      kind: intent
      reliability: 0.75
      cost_ms: 2000
      intent:
        action: android.intent.action.VIEW
        data: "https://gamma.app/create?prompt={query|urlencode}"
        package: com.gamma.app
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: gamma_creator, timeout_ms: 10000 }

    # ── Consensus: Scientific search ──
    - id: consensus_search
      when: "slots.app == 'consensus'"
      kind: intent
      reliability: 0.85
      cost_ms: 1000
      intent:
        action: android.intent.action.VIEW
        data: "https://consensus.app/search?query={query|urlencode}"
        package: com.consensus.android
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_settled, timeout_ms: 8000 }

    # ── Poe: Multi-model search ──
    - id: poe_search
      when: "slots.app == 'poe'"
      kind: intent
      reliability: 0.80
      cost_ms: 1200
      intent:
        action: android.intent.action.VIEW
        data: "https://poe.com/search?q={query|urlencode}"
        package: com.poe.android
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_settled, timeout_ms: 8000 }

    # ═══════════════════════════════════════════════════════════════════════
    # TIER 2: Share intent (for text processing workflows)
    # ═══════════════════════════════════════════════════════════════════════

    # ── Share to AI app (for summarize/rewrite/translate) ──
    - id: share_to_ai
      when: "slots.text_to_process != null and slots.capability in ['summarize', 'rewrite', 'translate']"
      kind: intent
      reliability: 0.85
      cost_ms: 1500
      intent:
        action: android.intent.action.SEND
        type: "text/plain"
        extras:
          EXTRA_TEXT: "{text_to_process}"
        package: "{app|to_package}"
        chooser: true
      then:
        - { op: wait, for: screen_settled, timeout_ms: 5000 }
        - { op: find_and_tap, target: { by: class, value: android.widget.EditText } }
        - { op: input_text, text: "{capability_command}" }
        - { op: system_key, key: "enter" }

    # ═══════════════════════════════════════════════════════════════════════
    # TIER 3: Clipboard workflow (for apps without deep links)
    # ═══════════════════════════════════════════════════════════════════════

    # ── Copy to clipboard + open app ──
    - id: clipboard_workflow
      when: "slots.app in ['grammarly', 'humata', 'notebooklm']"
      kind: ui_automation
      reliability: 0.70
      cost_ms: 3000
      steps:
        - id: copy_to_clipboard
          op: clipboard_set
          text: "{query}"
        - id: launch_app
          op: launch_app
          package: "{app|to_package}"
          wait: { for: screen_settled, timeout_ms: 5000 }
        - id: paste
          op: clipboard_paste
          target: { by: class, value: android.widget.EditText }

    # ═══════════════════════════════════════════════════════════════════════
    # TIER 4: Generic UI automation (lowest reliability, catches all)
    # ═══════════════════════════════════════════════════════════════════════

    - id: ui_generic
      kind: ui_automation
      reliability: 0.60
      cost_ms: 6000
      steps:
        - id: launch
          op: launch_app
          package: "{app|to_package}"
          wait: { for: screen_signature, value: "{app}_home", timeout_ms: 5000 }

        - id: handle_auth
          op: interrupt_check
          interrupt: auth_wall
          on_match: abort_with_message("Please sign in to {app} first.")

        - id: find_input
          op: find_and_tap
          target:
            candidates:
              - { by: class, value: android.widget.EditText, focusable: true }
              - { by: content_desc, matches: "(?i)message|input|ask|search|prompt", focusable: true }
          scroll_to_find: true
          max_swipes: 3

        - id: type_query
          op: input_text
          text: "{query}"
          method: ime_broadcast

        - id: submit
          op: system_key
          key: "enter"
          fallback:
            - op: find_and_tap
              target: { by: content_desc, matches: "(?i)send|submit" }

        - id: wait_response
          op: wait_for_screen_settled
          timeout_ms: 10000
          settle_checks: 3
          settle_interval_ms: 1500

        - id: extract_response
          op: extract_text
          target:
            candidates:
              - { by: class, value: android.widget.TextView, large_text: true }
              - { by: content_desc, matches: "(?i)response|answer|result" }
          max_chars: 2000
          emit_as: response

      postconditions:
        - { assert: foreground_package, equals: "{app|to_package}" }
        - { assert: screen_changed, from: "{app}_home" }

# ═══════════════════════════════════════════════════════════════════════════
# RESPONSE EXTRACTION — Read AI output
# ═══════════════════════════════════════════════════════════════════════════
response_extraction:
  strategy: adaptive
  methods:
    # Method 1: Read large TextViews (most AI apps)
    - id: text_view_scan
      target:
        by: class
        value: android.widget.TextView
        min_length: 100
        exclude_hints: ["sign in", "log in", "terms", "privacy"]
      priority: 1

    # Method 2: Content description (accessibility)
    - id: content_desc_scan
      target:
        by: content_desc
        matches: "(?i)response|answer|result|output"
      priority: 2

    # Method 3: WebView content (for web-based UIs)
    - id: webview_extract
      target:
        by: class
        value: android.webkit.WebView
      method: javascript_injection
      script: "document.body.innerText.substring(0, 2000)"
      priority: 3
      notes: "Use for ChatGPT, Claude, Perplexity web views"

  timeout_ms: 15000
  poll_interval_ms: 500
  settle_required: 2  # Wait for 2 consecutive identical reads

# ═══════════════════════════════════════════════════════════════════════════
# CAPABILITY-SPECIFIC WORKFLOWS
# ═══════════════════════════════════════════════════════════════════════════
capability_workflows:

  summarize:
    preferred_apps: [perplexity, chatgpt, claude]
    prompt_template: "Summarize this in 3-5 bullet points:\n\n{text_to_process}"
    output_format: bullet_points

  translate:
    preferred_apps: [deepl, chatgpt, google_translate]
    prompt_template: "Translate the following from {source_language} to {target_language}:\n\n{text_to_process}"
    pre_processing:
      - op: set_slot
        slot: target_language
        from: user_request
        default: "English"
    post_processing:
      - op: copy_to_clipboard
        source: response

  rewrite:
    preferred_apps: [quillbot, chatgpt, claude]
    prompt_template: "Rewrite this to be more {tone|default_professional}:\n\n{text_to_process}"
    tones: [professional, casual, formal, friendly, academic, concise]

  explain:
    preferred_apps: [chatgpt, perplexity, claude]
    prompt_template: "Explain {query} in simple terms with examples"
    follow_up_prompts:
      - "Can you explain that in more detail?"
      - "What are the key takeaways?"
      - "How does this apply to {context}?"

  code:
    preferred_apps: [chatgpt, claude, perplexity]
    prompt_template: "Write {programming_language|default_python} code to {query}"
    output_format: code_block
    capabilities:
      - generate_code
      - debug_code
      - explain_code
      - refactor_code
      - write_tests

  analyze:
    preferred_apps: [chatgpt, claude, perplexity]
    prompt_template: "Analyze the following and provide insights:\n\n{text_to_process|default_query}"
    capabilities:
      - sentiment_analysis
      - data_analysis
      - document_analysis
      - competitive_analysis

  generate:
    preferred_apps: [chatgpt, copilot, gamma]
    prompt_template: "Generate {query}"
    output_types:
      - text
      - image (copilot, dall-e)
      - presentation (gamma)
      - code (chatgpt, claude)

  research:
    preferred_apps: [consensus, perplexity, chatgpt]
    prompt_template: "Research {query} with citations and sources"
    output_format: citations
    post_processing:
      - op: extract_sources
        from: response

# ═══════════════════════════════════════════════════════════════════════════
# RECOVERY — Graceful degradation ladder
# ═══════════════════════════════════════════════════════════════════════════
recovery:
  # ── Auth failures ──
  - on: auth_wall
    do:
      - abort
      - notify_user: "Please sign in to {app} first."
    severity: warning

  - on: auth_expired
    do:
      - notify_user: "Your {app} session expired. Please re-login."
      - open_app_settings: "{app|to_package}"

  # ── Rate limiting ──
  - on: rate_limited
    do:
      - abort
      - notify_user: "{app} rate limit reached. Try again in a few minutes."
      - suggest_alternative: true  # Suggest another AI app
    severity: warning

  - on: quota_exceeded
    do:
      - abort
      - notify_user: "{app} daily quota exceeded. Try {alternative_app}?"
    severity: warning

  # ── App not installed ──
  - on: app_not_installed
    do:
      - delegate: search_install_app
        params: { query: "{app}" }
      - notify_user: "{app} isn't installed. Want me to find it on Play Store?"
    severity: info

  # ── Deep link failures ──
  - on: deep_link_failed
    do:
      - retry_with: ui_generic
      - notify_user: "Deep link failed, trying direct app control..."
    severity: warning

  - on: url_not_supported
    do:
      - fallback_to: ui_generic
      - log: "Deep link URL not supported for {app}"
    severity: info

  # ── UI automation failures ──
  - on: selector_not_found
    do:
      - rescan_after: 600ms
      - scroll_and_retry: 2
      - next_route
    severity: warning

  - on: wrong_screen
    do:
      - back: { max: 2 }
      - relaunch: "{app|to_package}"
      - next_route
    severity: warning

  - on: input_field_not_found
    do:
      - tap_center_of_screen  # Try tapping where input usually is
      - wait: 500ms
      - retry_find
    severity: warning

  # ── Response extraction failures ──
  - on: response_not_found
    do:
      - wait: 2000ms
      - retry_extract
      - if_still_failed:
        - notify_user: "I sent your question to {app}, but couldn't read the response. Please check the app."
    severity: warning

  - on: response_timeout
    do:
      - notify_user: "{app} is taking too long to respond. The query was sent — check the app for the answer."
      - do_not_retry: true
    severity: warning

  # ── Network failures ──
  - on: network_error
    do:
      - abort
      - notify_user: "No internet connection. All AI apps require internet."
    severity: error

  - on: timeout
    do:
      - abort
      - notify_user: "Connection timed out. Please check your internet and try again."
    severity: error

  # ── Content policy violations ──
  - on: content_blocked
    do:
      - abort
      - notify_user: "The query was blocked by {app}'s content policy. Please rephrase your question."
    severity: warning

  # ── Terminal fallback ──
  - on: all_routes_failed
    do:
      - escalate: llm_open_loop
      - budget_steps: 6
      - notify_user: "I couldn't complete the request. Trying advanced mode..."
    severity: error

  terminal_message: "I couldn't get an answer from {app}. Please try again or use a different AI app."

# ═══════════════════════════════════════════════════════════════════════════
# ROUTING — NLU triggers, priorities, disambiguation
# ═══════════════════════════════════════════════════════════════════════════
routing:
  priority: 70
  triggers:
    # ── Direct app mentions ──
    - "ask chatgpt about {query}"
    - "ask grok {query}"
    - "search perplexity for {query}"
    - "get gemini to explain {query}"
    - "ask claude {query}"
    - "have copilot {query}"
    - "use poe for {query}"
    - "translate {query} with deepl"
    - "paraphrase {query} with quillbot"
    - "create presentation about {query} with gamma"
    - "research {query} on consensus"

    # ── Generic AI queries ──
    - "ask ai {query}"
    - "what does the ai say about {query}"
    - "have ai summarize {topic}"
    - "chat with gpt about {query}"
    - "ask the assistant {query}"
    - "prompt ai with {query}"
    - "get an ai answer for {query}"
    - "ask ai to explain {query}"
    - "have ai write {query}"

    # ── Capability-specific ──
    - "summarize {text} using ai"
    - "translate {text} to {language}"
    - "rewrite {text} to be more {tone}"
    - "explain {concept} simply"
    - "write code for {query}"
    - "debug this code: {code}"
    - "analyze {data}"
    - "research {topic} with sources"
    - "generate {content_type} about {query}"

    # ── Clipboard workflows ──
    - "ask ai about what's in my clipboard"
    - "summarize my clipboard text"
    - "translate my clipboard"

  anti_triggers:
    - "search the web for {query}" -> web_search
    - "google {query}" -> web_search
    - "open chatgpt" -> open_app
    - "open {app}" -> open_app
    - "search youtube for {query}" -> search_video
    - "find {place} on maps" -> search_place

  required_entities: [query]
  optional_entities: [app, capability, target_language]

  disambiguate_against:
    - web_search
    - open_app
    - search_video
    - search_place
    - create_design  # Canva AI

  disambiguation_rules:
    # If user says "search" without "ai"/"ask", route to web_search
    - when: "query contains 'search' and not (query contains 'ai' or query contains 'ask')"
      route_to: web_search
    # If user says "open {app}" without query, route to open_app
    - when: "query is empty and app is specified"
      route_to: open_app
    # If user mentions "translate" with specific language, prefer deepl
    - when: "capability == 'translate' and target_language != null"
      prefer_app: deepl
    # If user mentions "grammar" or "spelling", prefer grammarly
    - when: "query matches '(?i)grammar|spelling|proofread'"
      prefer_app: grammarly
    # If user mentions "presentation" or "slides", prefer gamma
    - when: "query matches '(?i)presentation|slides|deck'"
      prefer_app: gamma
    # If user mentions "research" or "papers" or "studies", prefer consensus
    - when: "query matches '(?i)research|papers|studies|scientific'"
      prefer_app: consensus

# ═══════════════════════════════════════════════════════════════════════════
# OUTPUT — Response schema and templates
# ═══════════════════════════════════════════════════════════════════════════
output:
  schema:
    response:
      type: string
      description: "The AI's response text"
    source:
      type: string
      description: "Which AI app provided the response"
    capability_used:
      type: string
      description: "Which capability was invoked"
    sources_cited:
      type: array
      items: string
      description: "URLs/sources cited (for Perplexity, Consensus)"
    execution_time_ms:
      type: integer
      description: "Total execution time"
    route_used:
      type: string
      description: "Which execution route was used"

  templates:
    # ── Success ──
    success: "Here's what {app} says: {response|first_200}"
    success_with_source: "According to {app}: {response|first_200}\n\nSources: {sources_cited|first_3}"
    success_translate: "Translation ({target_language}): {response}"
    success_summarize: "Summary:\n{response}"
    success_code: "Here's the code:\n```\n{response}\n```"

    # ── Partial success ──
    sent_no_response: "I sent your question to {app}, but couldn't read the response. Please check the app."
    response_truncated: "Here's what {app} says (truncated): {response|first_200}..."

    # ── Failures ──
    failed: "I couldn't get a response from {app}."
    failed_auth: "Please sign in to {app} first."
    failed_rate: "{app} rate limit reached. Try again later or use a different AI."
    failed_network: "No internet connection. AI apps require internet."
    failed_not_installed: "{app} isn't installed. Want me to find it on the Play Store?"

    # ── Disambiguation ──
    disambiguate_app: "Which AI would you like to use? I can ask: ChatGPT, Claude, Perplexity, Gemini, or others."
    disambiguate_capability: "Would you like me to summarize, translate, rewrite, or explain this?"

  speak_pii: false

# ═══════════════════════════════════════════════════════════════════════════
# TELEMETRY — Observability and debugging
# ═══════════════════════════════════════════════════════════════════════════
telemetry:
  emit:
    - route_used
    - app_selected
    - capability_detected
    - deep_link_success
    - response_extracted
    - response_length
    - execution_time_ms
    - selector_hit_rank
    - interrupts_fired
    - outcome
    - fallback_triggered
  redact:
    - query  # May contain sensitive information
    - response  # May contain PII
    - text_to_process
  capture_on_failure:
    ui_dump: true
    screenshot: redacted
    last_n_steps: 5
    app_version: true
    network_state: true

# ═══════════════════════════════════════════════════════════════════════════
# TESTING — Validation rules
# ═══════════════════════════════════════════════════════════════════════════
testing:
  fixtures_required:
    - chatgpt_home
    - chatgpt_conversation
    - grok_home
    - perplexity_home
    - perplexity_results
    - gemini_home
  selector_validation:
    - validate_all_selectors_against_fixtures: true
    - min_confidence_threshold: 0.70
    - fallback_selector_required: true
  routing_validation:
    - test_utterances: 100
    - min_precision: 0.85
    - min_recall: 0.80
    - confusion_matrix_required: true
  e2e_validation:
    - devices: [SM-S918B, Pixel_8]
    - scenarios:
      - basic_query_chatgpt
      - basic_query_grok
      - basic_query_perplexity
      - basic_query_gemini
      - translate_deepl
      - summarize_perplexity
      - code_chatgpt
      - auth_wall_handling
      - rate_limit_handling
      - app_not_installed_handling
