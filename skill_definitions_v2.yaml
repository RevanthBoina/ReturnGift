# ═══════════════════════════════════════════════════════════════════════════
# SKILL 18: RECORD_AUDIO
# Grounded on: screen_34.xml — Voice Recorder,
# ad overlay present (handled by global_interrupts)
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: record_audio
version: "1.4.0"
status: draft
owner: "team-utility"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 30

taxonomy:
  domain: utility
  capability: write_local
  risk_tier: 2
  reversible: false
  idempotent: false
  est_duration_ms: 2000
  est_steps: 3

safety:
  requires_confirmation: true
  confirmation_mode: echo_action
  max_duration_seconds: 3600
  requires_permissions: [android.permission.RECORD_AUDIO]
  visible_indicator_required: true

compatibility:
  target_app:
    package: com.sec.android.app.voicenote
    tested_version_name: "21.2.10.0"
  android: { min_sdk: 29, max_sdk: 35 }
  device_profiles: [samsung_oneui_6_phone]
  form_factors: [phone]

grounding:
  fixtures:
    - id: voice_recorder
      path: fixtures/screen_34.xml
      captured_utc: "2026-07-15T00:00:00Z"
      tree_hash: null  # TODO: generate from real fixture file
  known_issues:
    - "Ad overlay present in captured screen — handled by global_interrupts.full_screen_ad"

slots:
  max_duration:
    type: integer
    required: false
    default: 300
    min: 1
    max: 3600

execution:
  strategy: first_success
  routes:
    - id: record_intent
      kind: intent
      reliability: 0.90
      cost_ms: 500
      intent:
        action: "android.provider.MediaStore.Audio.Media.RECORD_SOUND_ACTION"
      then:
        - { op: confirm_with_user, render: "Start recording audio?" }
        - { op: interrupt_check, interrupt: full_screen_ad }

    - id: ui_launch
      kind: ui_automation
      reliability: 0.65
      cost_ms: 3000
      steps:
        - id: launch
          op: launch_app
          package: com.sec.android.app.voicenote
          wait: { for: screen_settled, timeout_ms: 5000 }
        - id: dismiss_ad
          op: interrupt_check
          interrupt: full_screen_ad
        - id: confirm
          op: confirm_with_user
        - id: tap_record
          op: tap
          target: { by: content_desc, matches: "(?i)record|start recording" }
      postconditions:
        - { assert: foreground_package, equals: com.sec.android.app.voicenote }

recovery:
  - on: permission_denied
    do: [request_permission(RECORD_AUDIO), retry_once]
  - on: ad_overlay
    do: [handle_via_global_interrupt(full_screen_ad)]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 4]
  terminal_message: "I couldn't start recording."

routing:
  priority: 60
  triggers:
    - "start recording audio"
    - "record a voice note"
    - "open voice recorder"
    - "begin recording"
    - "record my voice"
    - "start a new audio recording"
    - "capture audio"
    - "record a memo"
    - "start voice recording"
  anti_triggers:
    - "open recorder" -> open_app
    - "play the recording" -> play_audio
  required_entities: []
  disambiguate_against: [open_app, play_audio]

output:
  schema:
    recording: { type: boolean }
    max_duration: { type: integer }
  templates:
    success: "Recording started. Say 'stop recording' when done."
    failed: "Could not start recording."

telemetry:
  emit: [route_used, ad_dismissed, permission_granted, outcome]
  capture_on_failure: { ui_dump: true, screenshot: redacted }


# ═══════════════════════════════════════════════════════════════════════════
# SKILL 19: VIEW_ASSIGNMENTS
# Grounded on: screen_17.xml — Google Classroom
# (com.google.android.apps.classroom)
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: view_assignments
version: "1.4.0"
status: draft
owner: "team-productivity"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 14

taxonomy:
  domain: info_academic
  capability: read
  risk_tier: 0
  reversible: true
  idempotent: true
  est_duration_ms: 2200
  est_steps: 3

compatibility:
  target_app:
    package: com.google.android.apps.classroom
    tested_version_name: "9.0.301.20.90.6"
    min_version_code: 90301000
  android: { min_sdk: 29, max_sdk: 35 }
  device_profiles: [samsung_oneui_6_phone, pixel_stock_14]
  form_factors: [phone]
  locales: [en-US, en-IN]
  requires_auth: true
  degrades_gracefully_offline: false

grounding:
  fixtures:
    - id: classroom_feed
      path: fixtures/screen_17.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
  screen_signatures:
    classroom_feed:
      package_equals: com.google.android.apps.classroom
      require_any:
        - { by: resource_id, matches: "class_list|classroom" }
        - { by: content_desc, matches: "(?i)classes|to-?do" }
      require_none:
        - { by: text, matches: "(?i)sign in|add account" }
      min_confidence: 0.80

slots:
  class_name:
    type: string
    required: false
    max_len: 64
    normalize: [trim, collapse_ws, casefold_compare]
    resolver: fuzzy_match_visible_text
    resolver_threshold: 0.72
    prompt_if_ambiguous: "Which class? I see: {candidates}"
  filter:
    type: enum
    values: [assigned, missing, done]
    default: assigned

execution:
  strategy: first_success
  routes:
    - id: deeplink
      kind: intent
      reliability: 0.93
      cost_ms: 700
      intent:
        action: android.intent.action.VIEW
        data: "https://classroom.google.com/u/0/a/not-turned-in/all"
        package: com.google.android.apps.classroom
        flags: [FLAG_ACTIVITY_NEW_TASK]
      verify:
        - { assert: on_screen, value: classroom_feed }

    - id: ui_plan
      kind: ui_automation
      reliability: 0.78
      cost_ms: 3100
      preconditions:
        - device.unlocked
        - app.installed(com.google.android.apps.classroom)
      steps:
        - id: launch
          op: launch_app
          package: com.google.android.apps.classroom
          wait: { for: screen_signature, value: classroom_feed, timeout_ms: 6000 }
        - id: open_todo
          op: tap
          target: sel.todo_tab
          optional: true
          skip_if: { on_screen: todo_list }
        - id: filter
          op: tap
          target: sel.filter_chip
          when: "slots.filter != 'assigned'"
        - id: extract
          op: extract
          from: sel.assignment_rows
          fields:
            title: { by: resource_id, value: "…:id/assignment_title" }
            due: { by: resource_id, value: "…:id/due_date" }
            course: { by: resource_id, value: "…:id/course_name" }
          limit: 10
          emit_as: assignments
      postconditions:
        - { assert: foreground_package, equals: com.google.android.apps.classroom }
        - { assert: extracted.assignments, min_count: 0 }

selectors:
  todo_tab:
    require_visible: true
    scroll_to_find: { container: sel.main_scroller, max_swipes: 3, direction: down }
    candidates:
      - { by: resource_id, value: "com.google.android.apps.classroom:id/todo_tab", conf: 0.95 }
      - { by: content_desc, matches: "(?i)^to-?do$", clickable: true, conf: 0.85 }
      - { by: text, matches: "(?i)^to-?do$", ancestor_clickable: true, conf: 0.70 }
      - { by: nth_of_class, class: android.widget.TabWidget, index: 1, conf: 0.35 }
  assignment_rows:
    multiple: true
    candidates:
      - { by: resource_id, value: "…:id/assignment_row", conf: 0.95 }
      - { by: class, value: androidx.recyclerview.widget.RecyclerView, child_of_scope: true, conf: 0.5 }

recovery:
  - on: selector_not_found
    do: [rescan_after(600ms), scroll_and_retry(2), next_route]
  - on: wrong_screen
    do: [back(max=2), relaunch, next_route]
  - on: auth_wall
    do: [abort, notify_user("Sign in to Classroom first.")]
  - on: app_not_installed
    do: [delegate: search_install_app(query="Google Classroom")]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 6]
  terminal_message: "I couldn't open your Classroom assignments."

routing:
  priority: 60
  triggers:
    - "show my assignments in classroom"
    - "what assignments are due"
    - "check my homework on classroom"
    - "what's due this week"
    - "classroom to-do list"
    - "view pending assignments"
    - "open classroom assignments"
    - "check for new assignments"
    - "view my classroom to-do list"
    - "kya assignment due hai"
  anti_triggers:
    - "open classroom" -> open_app
    - "submit assignment" -> unsupported
    - "open {filename} in drive" -> open_file_in_drive
  required_entities: []
  disambiguate_against: [open_app, open_file_in_drive]

output:
  schema:
    assignments: { type: array, items: [title, due, course] }
    count: { type: integer }
  templates:
    success_n: "You have {count} assignments due. Next: {assignments[0].title}, due {assignments[0].due}."
    success_0: "Nothing due in Classroom right now."
    partial: "Opened Classroom, but I couldn't read the list."
  speak_pii: false

telemetry:
  emit: [route_used, step_latency, selector_hit_rank, retries, outcome]
  redact: [class_name]
  capture_on_failure: { ui_dump: true, screenshot: redacted, last_n_steps: 5 }
