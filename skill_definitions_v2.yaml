        - { by: resource_id, value: "com.camerasideas.instashot:id/logo" }
      min_confidence: 0.85

slots:
  media_path:
    type: string
    required: false

execution:
  strategy: first_success
  routes:
    - id: ui_plan
      kind: ui_automation
      reliability: 0.55
      cost_ms: 10000
      checkpoint_capable: true
      steps:
        - id: launch
          op: launch_app
          package: com.camerasideas.instashot
          wait: { for: screen_signature, value: inshot_home, timeout_ms: 6000 }
        - id: tap_video
          op: tap
          target: { by: text, matches: "(?i)video" }
        - id: select_media
          op: select_media
          from: gallery
          when: "slots.media_path != null"
        - id: wait_editor
          op: wait
          for: screen_settled
          timeout_ms: 5000
      postconditions:
        - { assert: foreground_package, equals: com.camerasideas.instashot }
  abort_cleanup:
    - op: press
      key: KEYCODE_BACK
      retries: 3
    - op: tap
      target: { by: text, matches: "(?i)discard|delete|confirm" }
      optional: true

recovery:
  - on: project_interrupted
    do: [checkpoint_save, notify_user("Video project saved. Resume from InShot.")]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 8]
  terminal_message: "I couldn't start the video project."

routing:
  priority: 45
  triggers:
    - "create a new video in inshot"
    - "start a video project in inshot"
    - "edit a video using inshot"
    - "open inshot and create a video"
    - "make a new video project"
    - "create a video for instagram"
    - "open inshot video editor"
    - "edit my latest video in inshot"
  anti_triggers:
    - "open inshot" -> open_app
  required_entities: []
  disambiguate_against: [open_app]

output:
  schema:
    started: { type: boolean }
    project_name: { type: string }
  templates:
    success: "Opened InShot for a new video project."
    failed: "Could not start the video project."

telemetry:
  emit: [route_used, checkpoint_reached, outcome]


# ═══════════════════════════════════════════════════════════════════════════
# SKILL 16: OPEN_APP
# Grounded on: screen_39/40.xml — com.sec.android.app.launcher
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: open_app
version: "2.3.0"
status: draft
owner: "team-system"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 90

taxonomy:
  domain: default_app
  capability: read
  risk_tier: 0
  reversible: true
  idempotent: true
  est_duration_ms: 1200
  est_steps: 1

compatibility:
  target_app:
    package: com.sec.android.app.launcher
  android: { min_sdk: 29, max_sdk: 35 }
  form_factors: [phone]

grounding:
  fixtures:
    - id: launcher_home
      path: fixtures/screen_39.xml
      captured_utc: "2026-07-15T00:00:00Z"
      tree_hash: null  # TODO: generate from real fixture file

slots:
  app_name:
    type: string
    required: true
    max_len: 100
    resolver: package_manager_lookup
    normalize: [casefold, strip_spaces]
    prompt_if_missing: "Which app?"

execution:
  strategy: first_success
  routes:
    - id: monkey_launch
      kind: intent
      reliability: 0.95
      cost_ms: 400
      shell: "monkey -p {app_name|to_package} -c LAUNCHER 1"
      verify:
        - { assert: foreground_package, equals: "{app_name|to_package}" }

    - id: am_start
      kind: intent
      reliability: 0.90
      cost_ms: 400
      shell: "am start -n {app_name|to_package}/{app_name|main_activity}"
      verify:
        - { assert: foreground_package, equals: "{app_name|to_package}" }

recovery:
  - on: app_not_installed
    do: [delegate: search_install_app(query="{app_name}")]
  - on: app_crash
    do: [retry_once, notify_user("{app_name} crashed.")]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 2]
  terminal_message: "I couldn't open {app_name}."

routing:
  priority: 10  # LOWEST — anti_triggers on every domain skill
  triggers:
    - "open {app_name}"
    - "launch {app_name}"
    - "start {app_name}"
    - "open the {app_name} app"
    - "go to {app_name}"
    - "switch to {app_name}"
    - "bring up {app_name}"
    - "run {app_name}"
  anti_triggers:
    - "open my chat with {contact}" -> open_conversation
    - "search youtube for {query}" -> search_video
    - "set an alarm for {time}" -> set_alarm
    - "navigate to {place}" -> search_place
    - "send {message} to {contact}" -> send_message
    - "ask chatgpt about {query}" -> ask_external_ai
  required_entities: [app_name]
  disambiguate_against: [ALL_DOMAIN_SKILLS]

output:
  schema:
    opened: { type: boolean }
    app_name: { type: string }
  templates:
    success: "Opened {app_name}."
    not_installed: "{app_name} isn't installed. Want me to search the Play Store?"

telemetry:
  emit: [route_used, outcome]


