# SKILL 7: BOOK_RIDE
# Grounded on: screen_27.xml — com.rapido.passenger,
# content-desc "Home Screen", "Where do you want to go?" button,
# address_list_item0/1/2, current location TextView:
# "Kvr Enclave, 4th Lane, Venugopalnagar, Koritepadu, Guntur,
# Andhra Pradesh 522007, India"
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: book_ride
version: "1.6.0"
status: draft
owner: "team-lifestyle"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 14

taxonomy:
  domain: health_lifestyle
  capability: transact
  risk_tier: 3
  reversible: false
  idempotent: false
  est_duration_ms: 15000
  est_steps: 8

safety:
  requires_confirmation: true
  confirmation_mode: two_step_echo
  confirmation_fields: [destination, estimated_fare, pickup_location]
  auto_send: false
  never_retry_after: [ride_confirmed]
  max_fare_inr: 500
  rate_limit: 3  # per hour
  requires_permissions: [android.permission.ACCESS_FINE_LOCATION]

compatibility:
  target_app:
    package: com.rapido.passenger
    tested_version_name: "9.45.0"
  android: { min_sdk: 29, max_sdk: 35 }
  device_profiles: [samsung_oneui_6_phone]
  form_factors: [phone]
  locales: [en-IN]
  requires_auth: true

grounding:
  fixtures:
    - id: rapido_home
      path: fixtures/screen_27.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
  screen_signatures:
    rapido_home:
      package_equals: com.rapido.passenger
      require_all:
        - { by: content_desc, matches: "(?i)home screen" }
      require_any:
        - { by: content_desc, matches: "(?i)where do you want to go" }
      require_none:
        - { by: text, matches: "(?i)sign in|login|register" }
      min_confidence: 0.85
    rapido_destination_input:
      package_equals: com.rapido.passenger
      require_any:
        - { by: content_desc, matches: "(?i)where do you want to go" }
      min_confidence: 0.80

slots:
  destination:
    type: string
    required: true
    max_len: 200
    prompt_if_missing: "Where do you want to go?"
  ride_type:
    type: enum
    values: [bike, auto, cab]
    default: bike

execution:
  strategy: first_success
  routes:
    - id: ui_plan
      kind: ui_automation
      reliability: 0.72
      cost_ms: 12000
      preconditions:
        - device.unlocked
        - app.installed(com.rapido.passenger)
        - location_enabled
      steps:
        - id: launch
          op: launch_app
          package: com.rapido.passenger
          wait: { for: screen_signature, value: rapido_home, timeout_ms: 6000 }
        - id: handle_location_prompt
          op: interrupt_check
          interrupt: location_services_disabled
        - id: tap_destination
          op: tap
          target: { by: content_desc, matches: "(?i)where do you want to go" }
          wait: { for: screen_signature, value: rapido_destination_input, timeout_ms: 3000 }
        - id: type_destination
          op: type
          target: { by: class, value: android.widget.EditText, focusable: true }
          text: "{destination}"
          method: ime_broadcast
        - id: wait_suggestions
          op: wait
          for: results_settled
          timeout_ms: 3000
        - id: select_top_result
          op: tap
          target: { by: resource_id, value: "address_list_item0" }
          guard: { visible: true }
        - id: wait_fare
          op: wait
          for: screen_settled
          timeout_ms: 5000
        - id: extract_fare
          op: extract
          fields:
            fare: { by: text, matches: "₹[0-9]+" }
            pickup: { by: text, matches: "(?i)pickup|current location" }
          emit_as: ride_details
        - id: confirm_step1
          op: confirm_with_user
          render: "Ride to {destination}. Estimated fare: {ride_details.fare}. Confirm?"
          guard: { fare_under: 500 }
        - id: confirm_step2
          op: confirm_with_user
          render: "Final confirm: Book ride to {destination} for {ride_details.fare}?"
        - id: book
          op: tap
          target: { by: content_desc, matches: "(?i)confirm|book ride|confirm ride" }
      postconditions:
        - { assert: foreground_package, equals: com.rapido.passenger }
        - { assert: node_exists, target: { by: text, matches: "(?i)ride confirmed|finding driver|driver on the way" }, timeout_ms: 8000 }

recovery:
  - on: location_disabled
    do: [abort, notify_user("Please enable location services to book a ride.")]
  - on: fare_exceeds_max
    do: [abort, notify_user("Fare ₹{fare} exceeds ₹{max_fare} limit. Ride not booked.")]
  - on: no_drivers
    do: [notify_user("No drivers available right now. Try again later.")]
  - on: selector_not_found
    do: [rescan_after(1000ms), scroll_and_retry(2), next_route]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 6]
  terminal_message: "I couldn't book the ride."

routing:
  priority: 90
  triggers:
    - "book a rapido ride to {destination}"
    - "get a ride to {destination}"
    - "book a bike taxi to {destination}"
    - "ride to {destination} on rapido"
    - "hail a cab to {destination}"
    - "take me to {destination} via rapido"
    - "book an auto to {destination}"
    - "order a rapido to {destination}"
  anti_triggers:
    - "navigate to {destination}" -> search_place
    - "get directions to {destination}" -> search_place
    - "open rapido" -> open_app
  required_entities: [destination]
  disambiguate_against: [search_place, open_app]

output:
  schema:
    booked: { type: boolean }
    destination: { type: string }
    fare: { type: string }
    driver_eta: { type: string }
  templates:
    success: "Ride booked to {destination}. Fare: {fare}. Driver arriving in {driver_eta}."
    failed: "Could not book the ride."
  speak_pii: false

telemetry:
  emit: [route_used, step_latency, fare_extracted, confirmation_steps, outcome]
  redact: [pickup_location, exact_destination]
  capture_on_failure: { ui_dump: true, screenshot: redacted, last_n_steps: 5 }


