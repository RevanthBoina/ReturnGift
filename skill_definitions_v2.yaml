schema_version: "2.1"
skill_id: search_place
version: "2.0.0"
status: draft
owner: "team-navigation"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 30

taxonomy:
  domain: navigation
  capability: read
  risk_tier: 0
  reversible: true
  idempotent: true
  est_duration_ms: 3500
  est_steps: 3

compatibility:
  target_app:
    package: com.google.android.apps.maps
    tested_version_name: "11.135.0100"
  android: { min_sdk: 29, max_sdk: 35 }
  form_factors: [phone]
  locales: [en-US, en-IN]

grounding:
  fixtures:
    - id: maps_main
      path: fixtures/screen_18.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
  screen_signatures:
    maps_main:
      package_equals: com.google.android.apps.maps
      require_all:
        - { by: resource_id, value: "com.google.android.apps.maps:id/mainmap_container" }
      require_any:
        - { by: content_desc, matches: "(?i)layers|directions" }
      require_none:
        - { by: text, matches: "(?i)sign in" }
      min_confidence: 0.85

slots:
  place:
    type: string
    required: true
    max_len: 200
  origin:
    type: string
    required: false
  destination:
    type: string
    required: false
  mode:
    type: enum
    values: [driving, walking, transit, cycling]
    default: driving

execution:
  strategy: first_success
  routes:
    - id: geo_intent
      when: "slots.destination == null"
      kind: intent
      reliability: 0.95
      cost_ms: 500
      intent:
        action: android.intent.action.VIEW
        data: "geo:0,0?q={place|urlencode}"
        package: com.google.android.apps.maps
      verify:
        - { assert: on_screen, value: maps_main }

    - id: navigation_intent
      when: "slots.destination != null"
      kind: intent
      reliability: 0.95
      cost_ms: 500
      intent:
        action: android.intent.action.VIEW
        data: "google.navigation:q={destination|urlencode}&mode={mode|first_char}"
        package: com.google.android.apps.maps

    - id: ui_search
      kind: ui_automation
      reliability: 0.70
      cost_ms: 4000
      steps:
        - id: launch
          op: launch_app
          package: com.google.android.apps.maps
          wait: { for: screen_signature, value: maps_main, timeout_ms: 5000 }
        - id: handle_location_prompt
          op: interrupt_check
          interrupt: location_services_disabled
        - id: tap_search
          op: tap
          target: sel.maps_search_bar
        - id: type_place
          op: type
          target: { by: class, value: android.widget.EditText }
          text: "{place}"
          method: ime_broadcast
        - id: submit
          op: press
          key: KEYCODE_ENTER
        - id: wait_results
          op: wait
          for: screen_settled
          timeout_ms: 5000
      postconditions:
        - { assert: foreground_package, equals: com.google.android.apps.maps }

recovery:
  - on: location_disabled
    do: [prompt_user("Enable location for better results?"), continue_without]
  - on: no_results
    do: [notify_user("No places found for \"{place}\".")]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 4]
  terminal_message: "I couldn't find \"{place}\" on Maps."

routing:
  priority: 65
  triggers:
    - "navigate to {place}"
    - "get directions to {place}"
    - "find {place} on maps"
    - "how do i get to {place}"
    - "show me the route to {place}"
    - "search for {place} on google maps"
    - "directions from {origin} to {destination}"
    - "take me to {place}"
    - "where is {place}"
    - "navigate to {place} by {mode}"
  anti_triggers:
    - "book a ride to {place}" -> book_ride
    - "open maps" -> open_app
  required_entities: [place]
  disambiguate_against: [book_ride, open_app]

output:
  schema:
    found: { type: boolean }
    place_name: { type: string }
    address: { type: string }
  templates:
    success: "Showing {place} on Google Maps."
    not_found: "Couldn't find \"{place}\" on Maps."

telemetry:
  emit: [route_used, outcome]


