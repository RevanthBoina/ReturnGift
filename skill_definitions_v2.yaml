# ===========================================================================
# SKILL DEFINITIONS v2.1 — Production-Ready Schema
# ===========================================================================
# Implements the complete contract from the production review:
# - Intent-first execution with UI fallback
# - Resolution-independent selectors with ranked candidates
# - Machine-readable grounding (not comments)
# - Verification postconditions
# - Recovery ladders (retry → alt selector → deep link → intent → ask user → escalate)
# - Risk-tiered safety with confirmation gating
# - Observability hooks
#
# Source: https://github.com/RevanthBoina/google-s-dataset/tree/main/screen_xml
# Device: Samsung Galaxy SM-S918B (1080×2340, Android 14, OneUI 6)
#
# 270M MODEL CONSTRAINTS:
# - Skills are NOT planners — they are slot extractors + paraphrasers
# - Routing uses embedding retrieval + rules, not free-form LLM classification
# - UI trees are pruned to numbered flat lists, never raw XML
# - Deterministic step sequencing; LLM only for slot extraction + response
# ===========================================================================

# ═══════════════════════════════════════════════════════════════════════════
# GLOBAL INTERRUPTS (inherited by all skills)
# ═══════════════════════════════════════════════════════════════════════════
global_interrupts_v3:
  handlers:
    - id: runtime_permission
      match:
        package: com.google.android.permissioncontroller
      handle:
        op: tap
        target:
          by: resource_id
          value: "com.android.permissioncontroller:id/permission_allow_button"
      policy: allow_if_declared_in_skill

    - id: android_system_anr
      match:
        text_matches: "(?i)isn'?t responding"
      handle:
        op: tap
        text_matches: "(?i)wait"

    - id: app_update_prompt
      match:
        text_matches: "(?i)update (now|available)"
      handle:
        op: tap
        text_matches: "(?i)not now|later|skip"

    - id: full_screen_ad
      match:
        any:
          - resource_id_matches: ".*(interstitial|ad_close|close_ad).*"
          - content_desc_matches: "(?i)close ad|dismiss ad"
      handle:
        op: tap
        target: self
      retries: 2

    - id: rating_prompt
      match:
        text_matches: "(?i)rate (this|us)|enjoying|star rating"
      handle:
        op: tap
        text_matches: "(?i)not now|no thanks|later"

    - id: ime_covering_target
      match:
        ime_visible: true
        target_occluded: true
      handle:
        op: press
        key: KEYCODE_BACK

    - id: keyguard_locked
      match:
        package: com.android.systemui
        keyguard: true
      handle:
        op: abort
        reason: device_locked
      notify: "Device is locked. Please unlock to continue."

    - id: location_services_disabled
      match:
        text_matches: "(?i)location (services|access) (disabled|off)|turn on location"
      handle:
        op: tap
        text_matches: "(?i)enable|turn on|ok"
      policy: ask_user_if_not_declared

    - id: bluetooth_disabled_prompt
      match:
        text_matches: "(?i)turn on bluetooth|bluetooth is off"
      handle:
        op: tap
        text_matches: "(?i)turn on|enable|ok"
      policy: ask_user_if_not_declared


# ═══════════════════════════════════════════════════════════════════════════
# SHARED SELECTORS (reused across skills)
# ═══════════════════════════════════════════════════════════════════════════
shared_selectors:
  wa_search_icon:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/search_icon", conf: 0.95 }
      - { by: content_desc, matches: "(?i)search", conf: 0.80 }
  wa_search_field:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/search_text", conf: 0.95 }
      - { by: resource_id, value: "com.whatsapp:id/search_input", conf: 0.85 }
  wa_compose_box:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/entry", conf: 0.95 }
      - { by: class, value: android.widget.EditText, ancestor: "com.whatsapp:id/conversation_emoji_search", conf: 0.60 }
  wa_send_button:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/send", conf: 0.95 }
      - { by: content_desc, matches: "(?i)send", clickable: true, conf: 0.80 }
  wa_last_outgoing_bubble:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/message_text", last_of_type: true, conf: 0.85 }
  wa_chat_list:
    candidates:
      - { by: resource_id, value: "android:id/list", conf: 0.95 }
      - { by: resource_id, value: "com.whatsapp:id/conversation_list_view_host", conf: 0.90 }
  wa_conversation_row:
    multiple: true
    candidates:
      - { by: class, value: android.widget.Button, ancestor: "android:id/list", conf: 0.85 }
  wa_contact_name:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/conversations_row_contact_name", conf: 0.95 }
  wa_filter_all:
    candidates:
      - { by: content_desc, matches: "(?i)all filter.*selected", conf: 0.90 }
  wa_filter_unread:
    candidates:
      - { by: content_id, value: "com.whatsapp:id/conversations_filter_debug_view_id_unread", conf: 0.95 }
      - { by: content_desc, matches: "(?i)unread filter", conf: 0.80 }
  maps_search_bar:
    candidates:
      - { by: resource_id, value: "com.google.android.apps.maps:id/search_omnibox_text", conf: 0.95 }
      - { by: text, matches: "(?i)search here|where to", conf: 0.75 }
  maps_directions_button:
    candidates:
      - { by: content_desc, matches: "(?i)directions", conf: 0.90 }
      - { by: resource_id, value: "com.google.android.apps.maps:id/directions_fab", conf: 0.85 }


# ═══════════════════════════════════════════════════════════════════════════
# SKILL 1: SEND_MESSAGE
# Grounded on: screen_1.xml (WhatsApp), screen_24.xml (Messages),
#              screen_31.xml (Telegram), screen_32.xml (Snapchat),
#              screen_38.xml (Slack)
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: send_message
version: "2.0.0"
status: draft
owner: "team-messaging"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 21

taxonomy:
  domain: communication
  capability: communicate
  risk_tier: 2
  reversible: false
  idempotent: false
  est_duration_ms: 4500
  est_steps: 6

safety:
  requires_confirmation: true
  confirmation_mode: preview_before_send
  auto_send: false
  never_retry_after: [send_tapped]
  redact_in_logs: [body, recipient]
  blocklist_patterns:
    - "(?i)otp|one[- ]time password|cvv|pin code|password is"
  requires_permissions: []

compatibility:
  target_app:
    package: "{app|to_package}"
    tested_packages:
      - { pkg: com.whatsapp, version: "2.24.12.78" }
      - { pkg: com.google.android.apps.messaging, version: "20240318_01" }
      - { pkg: org.telegram.messenger, version: "10.11.1" }
      - { pkg: com.snapchat.android, version: "12.82.0.44" }
      - { pkg: com.Slack, version: "24.03.20.0" }
  android: { min_sdk: 29, max_sdk: 35 }
  device_profiles: [samsung_oneui_6_phone, pixel_stock_14]
  form_factors: [phone]
  locales: [en-US, en-IN]
  requires_auth: true

grounding:
  fixtures:
    - id: wa_chat_list
      path: fixtures/screen_1.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
    - id: messages_list
      path: fixtures/screen_24.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
    - id: telegram_list
      path: fixtures/screen_31.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
    - id: snapchat_feed
      path: fixtures/screen_32.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
  screen_signatures:
    wa_chat_list:
      package_equals: com.whatsapp
      require_all:
        - { by: resource_id, value: "com.whatsapp:id/conversation_list_view_host" }
      require_any:
        - { by: content_desc, matches: "(?i)swipe down to reveal" }
      require_none:
        - { by: text, matches: "(?i)sign in|verify|registration" }
      min_confidence: 0.85
    wa_chat_thread:
      package_equals: com.whatsapp
      require_all:
        - { by: resource_id, value: "com.whatsapp:id/entry" }
      require_any:
        - { by: content_desc, matches: "(?i)type a message" }
      min_confidence: 0.85
    messages_conversation_list:
      package_equals: com.google.android.apps.messaging
      require_any:
        - { by: resource_id, matches: "conversation_list" }
      min_confidence: 0.80

slots:
  app:
    type: enum
    values: [whatsapp, telegram, snapchat, slack, sms]
    required: true
    default_from: user_prefs.default_messaging_app
    inference_hints:
      whatsapp: ["whatsapp", "wa", "whats app"]
      telegram: ["telegram", "tg"]
      snapchat: ["snapchat", "snap"]
      slack: ["slack"]
      sms: ["text", "sms", "message app", "messages"]
  recipient:
    type: contact
    required: true
    resolver: contacts_provider
    on_multiple_matches: prompt_user
    on_zero_matches: fallback_to_in_app_search
    normalize: [trim, collapse_ws]
  body:
    type: string
    required: true
    max_len: 1000
    prompt_if_missing: "What should I say to {recipient.display_name}?"

execution:
  strategy: first_success
  routes:
    - id: wa_deeplink
      when: "slots.app == 'whatsapp' and slots.recipient.e164 != null"
      kind: intent
      reliability: 0.94
      cost_ms: 800
      intent:
        action: android.intent.action.VIEW
        data: "https://wa.me/{recipient.e164|strip_plus}?text={body|urlencode}"
        package: com.whatsapp
        flags: [FLAG_ACTIVITY_NEW_TASK]
      then:
        - { op: wait, for: screen_signature, value: wa_chat_thread, timeout_ms: 5000 }
        - { op: assert_text_in, target: sel.wa_compose_box, equals: "{body}" }
        - { op: confirm_with_user, render: "Send to {recipient.display_name}?" }
        - { op: tap, target: sel.wa_send_button }
      verify:
        - { assert: node_exists, target: sel.wa_last_outgoing_bubble, contains: "{body|first_40}", timeout_ms: 4000 }
        - { assert: not_exists, target: sel.wa_compose_box_nonempty }

    - id: sms_intent
      when: "slots.app == 'sms'"
      kind: intent
      reliability: 0.95
      cost_ms: 500
      intent:
        action: android.intent.action.SENDTO
        data: "smsto:{recipient.e164}"
        extras: { sms_body: "{body}" }
      then:
        - { op: confirm_with_user, render: "Send SMS to {recipient.display_name}?" }
        - { op: tap, target: { by: resource_id, value: "com.google.android.apps.messaging:id/send_button" } }
      verify:
        - { assert: node_exists, target: { by: text, matches: "{body|first_30}" }, timeout_ms: 3000 }

    - id: telegram_deeplink
      when: "slots.app == 'telegram' and slots.recipient.username != null"
      kind: intent
      reliability: 0.88
      cost_ms: 1000
      intent:
        action: android.intent.action.VIEW
        data: "tg://resolve?domain={recipient.username}"
        package: org.telegram.messenger

    - id: ui_generic
      kind: ui_automation
      reliability: 0.66
      cost_ms: 5000
      preconditions:
        - device.unlocked
        - app.installed("{app|to_package}")
      steps:
        - id: launch
          op: launch_app
          package: "{app|to_package}"
          wait: { for: screen_signature, value: "{app}_list_screen", timeout_ms: 6000 }
        - id: search_contact
          op: tap
          target: "sel.{app}_search_icon"
        - id: type_name
          op: type
          target: "sel.{app}_search_field"
          text: "{recipient.display_name}"
          method: ime_broadcast
        - id: wait_results
          op: wait
          for: results_settled
          timeout_ms: 2500
        - id: select_contact
          op: tap
          target: "sel.{app}_first_result"
          guard: { text_similarity_to: "{recipient.display_name}", min: 0.80 }
        - id: assert_thread
          op: assert
          that: on_screen
          value: "{app}_chat_thread"
        - id: type_message
          op: type
          target: "sel.{app}_compose_box"
          text: "{body}"
          method: ime_broadcast
        - id: confirm
          op: confirm_with_user
        - id: send
          op: tap
          target: "sel.{app}_send_button"
      postconditions:
        - { assert: foreground_package, equals: "{app|to_package}" }
        - { assert: node_exists, target: "sel.{app}_last_outgoing_bubble", timeout_ms: 4000 }

selectors:
  wa_compose_box_nonempty:
    candidates:
      - { by: resource_id, value: "com.whatsapp:id/entry", has_text: true, conf: 0.90 }

recovery:
  - on: selector_not_found
    do: [rescan_after(600ms), scroll_and_retry(2), next_route]
  - on: wrong_screen
    do: [back(max=2), relaunch, next_route]
  - on: auth_wall
    do: [abort, notify_user("Please sign in to {app} first.")]
  - on: wrong_recipient_selected
    do: [back(1), abort, notify_user("I wasn't confident about the contact — cancelled.")]
  - on: send_ambiguous
    do: [do_not_retry, escalate_to_user("I may have sent it — please check {app}.")]
  - on: app_not_installed
    do: [delegate: search_install_app(query="{app}")]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 6]
  terminal_message: "I couldn't send the message."

routing:
  priority: 80
  triggers:
    - "send a message to {contact} on {app}"
    - "text {contact} saying {message}"
    - "reply to {contact} with {message}"
    - "send {message} to the {group} group"
    - "message {contact} on {app}"
    - "dm {contact} on slack"
    - "send an sms to {contact}"
    - "tell {contact} {message}"
    - "snap {contact} a message"
    - "forward my last message to {contact}"
  anti_triggers:
    - "open {contact}'s chat" -> open_conversation
    - "show messages from {contact}" -> open_conversation
    - "call {contact}" -> make_phone_call
  required_entities: [recipient]
  disambiguate_against: [open_conversation, make_phone_call]

output:
  schema:
    sent: { type: boolean }
    recipient: { type: string }
    app: { type: string }
  templates:
    success: "Message sent to {recipient.display_name} via {app}."
    failed: "Failed to send message to {recipient.display_name}."
  speak_pii: false

telemetry:
  emit: [route_used, step_latency, selector_hit_rank, retries, outcome, confirmation]
  redact: [body, recipient.e164]
  capture_on_failure: { ui_dump: true, screenshot: redacted, last_n_steps: 5 }


# ═══════════════════════════════════════════════════════════════════════════
# SKILL 2: OPEN_CONVERSATION
# Grounded on: screen_1.xml — RecyclerView android:id/list, filter buttons
# "All filter", "Unread filter, 2, unselected", content-desc on rows
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: open_conversation
version: "1.3.0"
status: draft
owner: "team-messaging"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 21

taxonomy:
  domain: communication
  capability: read
  risk_tier: 0
  reversible: true
  idempotent: true
  est_duration_ms: 2500
  est_steps: 4

compatibility:
  target_app:
    package: "{app|to_package}"
    tested_packages:
      - { pkg: com.whatsapp, version: "2.24.12.78" }
      - { pkg: org.telegram.messenger, version: "10.11.1" }
      - { pkg: com.snapchat.android, version: "12.82.0.44" }
      - { pkg: com.Slack, version: "24.03.20.0" }
  android: { min_sdk: 29, max_sdk: 35 }
  form_factors: [phone]
  locales: [en-US, en-IN]

grounding:
  fixtures:
    - id: wa_chat_list
      path: fixtures/screen_1.xml
      captured_utc: "2026-07-15T00:00:00Z"
      tree_hash: null  # TODO: generate from real fixture file
  screen_signatures:
    wa_chat_list:
      package_equals: com.whatsapp
      require_all:
        - { by: resource_id, value: "com.whatsapp:id/conversation_list_view_host" }
      require_any:
        - { by: content_desc, matches: "(?i)swipe down to reveal" }
      min_confidence: 0.85

slots:
  app:
    type: enum
    values: [whatsapp, telegram, snapchat, slack, sms]
    required: true
    default: whatsapp
  contact:
    type: contact
    required: true
    resolver: fuzzy_match_visible_text
    resolver_threshold: 0.72
    prompt_if_ambiguous: "Which chat? I see: {candidates}"
  filter:
    type: enum
    values: [all, unread, favourites, groups]
    default: all

execution:
  strategy: first_success
  routes:
    - id: deeplink_wa
      when: "slots.app == 'whatsapp' and slots.contact.e164 != null"
      kind: intent
      reliability: 0.90
      cost_ms: 600
      intent:
        action: android.intent.action.VIEW
        data: "https://wa.me/{contact.e164|strip_plus}"
        package: com.whatsapp
      verify:
        - { assert: on_screen, value: wa_chat_thread }

    - id: ui_plan
      kind: ui_automation
      reliability: 0.75
      cost_ms: 3000
      steps:
        - id: launch
          op: launch_app
          package: "{app|to_package}"
          wait: { for: screen_signature, value: wa_chat_list, timeout_ms: 5000 }
        - id: apply_filter
          op: tap
          target: "sel.wa_filter_{filter}"
          when: "slots.filter != 'all'"
          optional: true
        - id: find_contact
          op: scroll_find_tap
          list: sel.wa_chat_list
          match:
            target: sel.wa_contact_name
            text_similarity_to: "{contact.display_name}"
            min: 0.75
          max_swipes: 5
        - id: assert_thread
          op: assert
          that: on_screen
          value: wa_chat_thread
      postconditions:
        - { assert: on_screen, value: wa_chat_thread }

recovery:
  - on: contact_not_found_in_list
    do: [scroll_and_retry(3), tap_search_and_type(contact.display_name)]
  - on: selector_not_found
    do: [rescan_after(600ms), next_route]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 4]
  terminal_message: "I couldn't find that conversation."

routing:
  priority: 75
  triggers:
    - "open my chat with {contact}"
    - "show me {contact}'s conversation"
    - "go to the {group} group chat"
    - "open unread messages"
    - "switch to the unread filter"
    - "show my chats with {contact}"
    - "navigate to {contact}'s chat"
  anti_triggers:
    - "send {message} to {contact}" -> send_message
    - "call {contact}" -> make_phone_call
  required_entities: [contact]
  disambiguate_against: [send_message, make_phone_call]

output:
  schema:
    opened: { type: boolean }
    contact: { type: string }
  templates:
    success: "Opened conversation with {contact.display_name}."
    not_found: "Couldn't find a conversation with {contact.display_name}."

telemetry:
  emit: [route_used, step_latency, filter_applied, outcome]


# ═══════════════════════════════════════════════════════════════════════════
# SKILL 3: MAKE_PHONE_CALL
# Grounded on: screen_12.xml — com.samsung.android.dialer,
# two_pane_container, navigation_rail_area, coordinator_layout
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: make_phone_call
version: "2.1.0"
status: draft
owner: "team-communication"
last_validated_utc: "2026-07-20T10:00:00Z"
staleness_sla_days: 30

taxonomy:
  domain: communication
  capability: communicate
  risk_tier: 2
  reversible: false
  idempotent: false
  est_duration_ms: 1500
  est_steps: 2

safety:
  requires_confirmation: true
  confirmation_mode: echo_number_before_call
  blocklist_patterns: ["^0900", "^1900", "^900"]  # premium rate numbers
  requires_permissions: [android.permission.CALL_PHONE]

compatibility:
  target_app:
    package: com.samsung.android.dialer
    tested_version_name: "14.1.00.8"
  android: { min_sdk: 29, max_sdk: 35 }
  device_profiles: [samsung_oneui_6_phone]
  form_factors: [phone]

grounding:
  fixtures:
    - id: dialer_keypad
      path: fixtures/screen_12.xml
      captured_utc: "2026-07-15T00:00:00Z"
      device: "SM-S918B/api34/1080x2340/dpi420"
      tree_hash: null  # TODO: generate from real fixture file
  screen_signatures:
    dialer_keypad:
      package_equals: com.samsung.android.dialer
      require_all:
        - { by: resource_id, value: "com.samsung.android.dialer:id/dialtacts_main_layout" }
      require_any:
        - { by: resource_id, value: "com.samsung.android.dialer:id/two_pane_container" }
      min_confidence: 0.85

slots:
  contact:
    type: contact
    required: false
    resolver: contacts_provider
  phone_number:
    type: string
    required: false
    pattern: "^[+]?[0-9\\s\\-()]{7,15}$"
    normalize: [strip_whitespace, strip_dashes]

execution:
  strategy: first_success
  routes:
    - id: tel_intent
      when: "slots.phone_number != null"
      kind: intent
      reliability: 0.98
      cost_ms: 300
      intent:
        action: android.intent.action.VIEW
        data: "tel:{phone_number}"
      then:
        - { op: confirm_with_user, render: "Call {phone_number}?" }
        - { op: tap, target: { by: content_desc, matches: "(?i)call|dial" } }
      verify:
        - { assert: foreground_package, equals: com.samsung.android.dialer }

    - id: contact_lookup
      when: "slots.contact != null and slots.phone_number == null"
      kind: intent
      reliability: 0.90
      cost_ms: 500
      intent:
        action: android.intent.action.VIEW
        data: "tel:{contact.e164}"
      then:
        - { op: confirm_with_user, render: "Call {contact.display_name}?" }

    - id: ui_dialpad
      kind: ui_automation
      reliability: 0.70
      cost_ms: 3000
      steps:
        - id: launch_dialer
          op: launch_app
          package: com.samsung.android.dialer
          wait: { for: screen_signature, value: dialer_keypad, timeout_ms: 4000 }
        - id: dial_number
          op: type
          target: { by: resource_id, value: "com.samsung.android.dialer:id/digits" }
          text: "{phone_number}"
        - id: confirm
          op: confirm_with_user
        - id: tap_call
          op: tap
          target: { by: content_desc, matches: "(?i)call" }
      postconditions:
        - { assert: foreground_package, equals: com.samsung.android.dialer }

recovery:
  - on: permission_denied
    do: [request_permission(CALL_PHONE), retry_once]
  - on: invalid_number
    do: [abort, notify_user("The number doesn't look valid: {phone_number}")]
  - on: all_routes_failed
    do: [escalate: llm_open_loop, budget_steps: 4]
  terminal_message: "I couldn't place the call."

routing:
  priority: 85
  triggers:
    - "call {contact}"
    - "dial {phone_number}"
    - "phone {contact}"
    - "ring {contact}"
    - "make a voice call to {contact}"
    - "call the number {phone_number}"
    - "give {contact} a call"
    - "connect me to {contact}"
  anti_triggers:
    - "send a message to {contact}" -> send_message
    - "video call {contact}" -> unsupported
  required_entities: []

output:
  schema:
    calling: { type: boolean }
    target: { type: string }
  templates:
    success: "Calling {target}..."
    failed: "Could not place the call."

telemetry:
  emit: [route_used, outcome, blocklist_hit]
  redact: [phone_number]


# ═══════════════════════════════════════════════════════════════════════════
# SKILL 4: ASK_EXTERNAL_AI
# Grounded on: screen_3.xml (ChatGPT), screen_7.xml (Grok),
#              screen_8.xml (Perplexity), screen_19.xml (Gemini)
# screen_3.xml: ComposeView-based UI, package com.openai.chatgpt
# ═══════════════════════════════════════════════════════════════════════════
---
schema_version: "2.1"
skill_id: ask_external_ai
version: "2.0.0"
status: canary
owner: "team-info"
last_validated_utc: "2026-08-01T00:00:00Z"
staleness_sla_days: 14

# ═══════════════════════════════════════════════════════════════════════════
# TAXONOMY
# ═══════════════════════════════════════════════════════════════════════════
taxonomy:
  domain: info_academic
  capability: read  # read | write_local | communicate | transact
  risk_tier: 0      # 0=read-only, 1=local write, 2=outbound, 3=financial
  reversible: true
  idempotent: true
  est_duration_ms: 8000
  est_steps: 4
  scope_note: >
    Covers conversational AI queries to external services. Does NOT cover:
    - web_search (Google/Bing search results)
    - open_app (just launching without querying)
    - create_design (Canva AI)
    - search_video (YouTube search)
    If the user wants to search the web, route to web_search.
    If the user wants to open an AI app without a query, route to open_app.

# ═══════════════════════════════════════════════════════════════════════════
# SAFETY & PERMISSIONS
# ═══════════════════════════════════════════════════════════════════════════
safety:
  requires_confirmation: false
  confirmation_mode: none  # Read-only queries don't need confirmation
  auto_send: false
  redact_in_logs: [query]  # Queries may contain sensitive info
  blocklist_patterns:
    - "(?i)hack|exploit|bypass|crack"  # Refuse malicious prompts
    - "(?i)generate.*malware|create.*virus"
  requires_permissions: []

# ═══════════════════════════════════════════════════════════════════════════
# COMPATIBILITY — Complete per-app entries
# ═══════════════════════════════════════════════════════════════════════════
compatibility:
  target_app:
    package: "{app|to_package}"
    tested_packages:
      # ── Tier 1: Deep link supported, tested ──
      - pkg: com.openai.chatgpt
        version_name: "1.2024.191"
        version_code: 191
        deep_link: "https://chat.openai.com/?q={query}"
        browser_fallback_url: "https://chat.openai.com/?q={query|urlencode}"
        capabilities: [chat, summarize, translate, rewrite, code, analyze]
        auth_required: true
        free_tier: true
        notes: "Canvas feature for long-form editing (ChatGPT Plus)"

      - pkg: ai.perplexity.app
        version_name: "2.15.0"
        version_code: 2150
        deep_link: "https://www.perplexity.ai/search?q={query}"
        browser_fallback_url: "https://www.perplexity.ai/search?q={query|urlencode}"
        capabilities: [chat, search, cite_sources, summarize]
        auth_required: false  # Works without login
        free_tier: true
        notes: "Best for research with citations"

      # ── Tier 2: Deep link supported, needs validation ──
      - pkg: com.x.ai
        version_name: "1.0.8"
        version_code: 108
        deep_link: "https://x.ai/?q={query}"
        browser_fallback_url: "https://x.ai/?q={query|urlencode}"
