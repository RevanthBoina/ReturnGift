        browser_fallback_url: "https://www.deepl.com/translator#auto/en/{query|urlencode}"
        capabilities: [translate, context_aware]
        auth_required: false
        free_tier: true
        notes: "High-quality translation; 25+ languages"

      - pkg: com.quillbot.mobile
        version_name: "1.0.0"
        version_code: 100
        deep_link: "https://quillbot.com/paraphrase?text={query}"
        browser_fallback_url: "https://quillbot.com/paraphrase?text={query|urlencode}"
        capabilities: [paraphrase, rewrite, summarize, grammar]
        auth_required: false
        free_tier: true
        notes: "Paraphrasing specialist"

      - pkg: com.gamma.app
        version_name: "1.0.0"
        version_code: 100
        deep_link: "https://gamma.app/create?prompt={query}"
        browser_fallback_url: "https://gamma.app/create?prompt={query|urlencode}"
        capabilities: [presentation, deck, webpage, visual_content]
        auth_required: true
        free_tier: true
        notes: "Generates presentations, pitch decks, web pages"

      - pkg: com.notebooklm.android
        version_name: "1.0.0"
        version_code: 100
        deep_link: "https://notebooklm.google.com/"
        browser_fallback_url: "https://notebooklm.google.com/"
        capabilities: [document_chat, audio_summary, study_guide]
        auth_required: true
        free_tier: true
        notes: "Chat with uploaded documents; audio overview generation"

      - pkg: com.consensus.android
        version_name: "1.0.0"
        version_code: 100
        deep_link: "https://consensus.app/search?query={query}"
        browser_fallback_url: "https://consensus.app/search?query={query|urlencode}"
        capabilities: [research, scientific_papers, evidence_based]
        auth_required: false
        free_tier: true
        notes: "Peer-reviewed scientific paper search"

      - pkg: com.humata.android
        version_name: "1.0.0"
        version_code: 100
        deep_link: "https://www.humata.ai/"
        browser_fallback_url: "https://www.humata.ai/"
        capabilities: [pdf_analysis, document_qa, summarize]
        auth_required: true
        free_tier: true
        notes: "Upload PDFs and ask questions"

  android:
    min_sdk: 29
    max_sdk: 35
  device_profiles:
    - samsung_oneui_6_phone
    - pixel_stock_14
    - xiaomi_miui_14
  form_factors: [phone]
  locales: [en-US, en-IN, en-GB, hi-IN, es-ES, de-DE, fr-FR, ja-JP, ko-KR]
  requires_auth: true  # Most AI apps require authentication
